# FI2T — single domain path routing (matches DEPLOYMENT.md)
#   /api/*      → php-fpm :9000
#   /storage/*  → shared upload volume
#   /admin/*    → frontend dist
#   /*          → website dist

upstream php-fpm {
    server php-fpm:9000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    # ── Laravel API ───────────────────────────────────────────────────────────
    location /api {
        include fastcgi_params;
        fastcgi_pass php-fpm;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 120s;
    }

    # Health check (Laravel)
    location = /up {
        include fastcgi_params;
        fastcgi_pass php-fpm;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # ── CMS uploads (shared volume with php-fpm) ───────────────────────────────
    location /storage/ {
        alias /var/www/storage/;
        expires 30d;
        access_log off;
    }

    # ── Admin CMS (frontend/dist under /admin/) ───────────────────────────────
    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /admin {
        return 301 /admin/;
    }

    # ── Public website (website/dist) ─────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
